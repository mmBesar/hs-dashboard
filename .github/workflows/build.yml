# Builds the hs-dashboard image for amd64 + arm64 + riscv64 and pushes it to GHCR.
#
# No QEMU anywhere: the Dockerfile cross-compiles the Go binary natively and the
# final image is just that binary on "scratch", so nothing has to run on the target CPU.
# (One fast amd64 runner builds all three — no need for the arm64 / RISE runners.)
name: build

on:
  workflow_dispatch:            # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:                      # only rebuild when something that ends up in the image changes
      - '*.go'
      - 'go.mod'
      - 'config.jsonc'
      - 'web/**'
      - 'Dockerfile'
      - '.github/workflows/build.yml'

permissions:
  contents: read
  packages: write               # needed to push to ghcr.io

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # GHCR image names must be lowercase (mmBesar -> mmbesar).
      - name: Lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: "latest" plus the short commit id (handy for rolling back).
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true            # software bill of materials; provenance is on by default
